<!doctype html>
<!-- SPIKE JETABLE : test des sélecteurs Google (drive.file). À supprimer après le test. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Test du sélecteur</title>
    <style>
      body { font-family: -apple-system, sans-serif; margin: 0; padding: calc(env(safe-area-inset-top) + 12px) 16px 24px; }
      h1 { font-size: 1.3rem; }
      button { display: block; width: 100%; margin: 8px 0; padding: 14px; font-size: 1rem; border-radius: 12px; border: 1px solid #ccc; background: #fff; }
      button:disabled { opacity: 0.4; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.8rem; background: #f3f3f3; padding: 10px; border-radius: 8px; }
    </style>
  </head>
  <body>
    <h1>Test du sélecteur (page jetable)</h1>
    <button id="hosted">A. Sélecteur hébergé par Google</button>
    <button id="login">B1. Connexion pour le sélecteur intégré</button>
    <button id="embedded" disabled>B2. Ouvrir le sélecteur intégré</button>
    <pre id="log"></pre>
    <script>
      const CLIENT_ID = '35997029151-nhu1lf97438h3omo0b1imttlb4tss6tt.apps.googleusercontent.com'
      const API_KEY = ''
      const APP_ID = '35997029151'
      const SCOPE = 'https://www.googleapis.com/auth/drive.file'
      const SHEET = 'application/vnd.google-apps.spreadsheet'
      const REDIRECT = location.origin + location.pathname
      let token = null

      const log = (...parts) => {
        document.getElementById('log').textContent += parts.join(' ') + '\n'
      }

      function authUrl(mode, extra) {
        const state = crypto.randomUUID()
        localStorage.setItem('picker-test.state', state)
        localStorage.setItem('picker-test.mode', mode)
        // Pas d'include_granted_scopes : le jeton ne doit couvrir que drive.file
        const params = new URLSearchParams({ client_id: CLIENT_ID, redirect_uri: REDIRECT, response_type: 'token', scope: SCOPE, state, ...extra })
        return 'https://accounts.google.com/o/oauth2/v2/auth?' + params
      }

      async function drive(path) {
        const response = await fetch('https://www.googleapis.com/drive/v3/' + path, { headers: { Authorization: 'Bearer ' + token } })
        return { status: response.status, text: await response.text() }
      }

      async function readFile(id) {
        const meta = await drive(`files/${encodeURIComponent(id)}?fields=name,modifiedTime`)
        log('Lecture des infos du fichier :', meta.status, meta.text.replace(/\s+/g, ' '))
        const csv = await drive(`files/${encodeURIComponent(id)}/export?mimeType=text%2Fcsv`)
        const lines = csv.text.split('\n')
        log('Export CSV :', csv.status, csv.status === 200 ? `${lines.length} lignes, colonnes 1-2 : ${lines[0].split(',').slice(0, 2).join(',')}` : csv.text.slice(0, 300))
      }

      async function listVisible() {
        const list = await drive('files?pageSize=20&fields=files(name)')
        const names = list.status === 200 ? (JSON.parse(list.text).files || []).map((f) => f.name) : []
        log('Fichiers visibles par l’app :', list.status, names.length ? names.join(' | ') : '(aucun)')
      }

      function consumeReturn() {
        const all = new URLSearchParams(location.search)
        new URLSearchParams(location.hash.slice(1)).forEach((value, key) => all.set(key, value))
        if ([...all.keys()].length === 0) return null
        history.replaceState(null, '', location.pathname)
        log('Retour de Google :')
        for (const [key, value] of all) log('  ' + key + ' = ' + (key === 'access_token' ? '(présent)' : value))
        if (all.get('state') !== localStorage.getItem('picker-test.state')) log('⚠ state différent de celui envoyé')
        return all
      }

      function loadPicker() {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script')
          script.src = 'https://apis.google.com/js/api.js'
          script.onload = () => gapi.load('picker', { callback: resolve, onerror: reject })
          script.onerror = reject
          document.head.appendChild(script)
        })
      }

      async function openEmbedded() {
        try {
          await loadPicker()
          const view = new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS)
            .setMode(google.picker.DocsViewMode.LIST)
            .setQuery('Saved translations')
          const picker = new google.picker.PickerBuilder()
            .setAppId(APP_ID)
            .setOAuthToken(token)
            .setDeveloperKey(API_KEY)
            .setLocale('fr')
            .enableFeature(google.picker.Feature.NAV_HIDDEN)
            .addView(view)
            .setCallback(async (data) => {
              if (data.action === google.picker.Action.PICKED) {
                log('Choisi :', data.docs[0].name)
                await readFile(data.docs[0].id)
                await listVisible()
              } else if (data.action === google.picker.Action.CANCEL) {
                log('Sélecteur fermé sans choix')
              }
            })
            .build()
          picker.setVisible(true)
        } catch (error) {
          log('Erreur du sélecteur intégré :', String(error && (error.message || error.type || error)))
        }
      }

      document.getElementById('hosted').onclick = () =>
        location.assign(authUrl('hosted', { trigger_onepick: 'true', prompt: 'consent', mimetypes: SHEET }))
      document.getElementById('login').onclick = () => location.assign(authUrl('embedded', {}))
      document.getElementById('embedded').onclick = () => void openEmbedded()
      if (!API_KEY) {
        document.getElementById('login').disabled = true
        log('Sélecteur intégré (B) : clé d’API pas encore configurée.')
      }

      ;(async () => {
        const back = consumeReturn()
        if (!back || !back.get('access_token')) return
        token = back.get('access_token')
        if (localStorage.getItem('picker-test.mode') === 'hosted') {
          const ids = (back.get('picked_file_ids') || '').split(',').filter(Boolean)
          log('Fichiers choisis :', ids.length ? ids.join(', ') : '(aucun)')
          for (const id of ids) await readFile(id)
          await listVisible()
        } else {
          document.getElementById('embedded').disabled = false
          log('Connecté : touche B2 pour ouvrir le sélecteur intégré.')
          await listVisible()
        }
      })()
    </script>
  </body>
</html>
